name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Тесты движка
        run: npm test
      - name: Типы
        run: npm run typecheck
      - name: Сборка библиотеки
        run: npm run build:lib
      - name: Приложение собирается
        run: npm run build
