name: Publish

# Публикация пакета `chroma42` в npm — по релизу или вручную.
# Требуется секрет NPM_TOKEN (репозиторий → Settings → Secrets and variables
# → Actions → New repository secret). Без секрета workflow упадёт на шаге
# publish — это ожидаемо и безопасно: пакет не уедет в реестр молча.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Сборка пакета
        run: npm run build:lib
      - name: Публикация в npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
